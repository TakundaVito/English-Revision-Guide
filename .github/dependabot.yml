version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      flutter-dependencies:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /admin
    schedule:
      interval: weekly
    groups:
      admin-flutter-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node-dependencies:
        patterns: ["*"]
