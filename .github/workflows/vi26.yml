name: VI26 release gates

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Record Flutter doctor
        shell: pwsh
        run: flutter doctor -v

      - name: Run VI26 automated gates
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Upload verification evidence and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmaprep-vi26-${{ github.sha }}
          if-no-files-found: warn
          path: |
            docs/verification/latest.json
            build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
